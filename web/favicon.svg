<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RL Pro Tracker">
  <!-- Site palette: --ink background, --accent mark. A rising bar chart reads
       as "activity tracking" at 16px, where a car or ball would turn to mush. -->
  <rect width="64" height="64" rx="14" fill="#0C0E13"/>
  <rect x="12" y="36" width="9" height="16" rx="2.5" fill="#565E6A"/>
  <rect x="27.5" y="26" width="9" height="26" rx="2.5" fill="#8B90A0"/>
  <rect x="43" y="12" width="9" height="40" rx="2.5" fill="#FF5A1F"/>
</svg>
