name: Liveness

# Watches the published data and does something about it when it goes stale.
#
# The failure this exists for produces no error anywhere: on 2026-09-02 the
# Cloudflare Worker's cron triggers stopped firing while the Worker itself stayed
# healthy - registered schedules, no incident, no invocations, and a redeploy
# changed nothing. Nothing failed, so nothing notified, and the board quietly
# served numbers 19 minutes old.
#
# GitHub's scheduler drops runs too, so this is deliberately not the primary
# trigger for anything. It is a watchdog: whenever it does run, it checks how old
# the published data is, pokes the Worker to dispatch the collectors if needed,
# and says so on Discord.

on:
  schedule:
    # GitHub drops most scheduled runs on public repos, and this one is no
    # exception: measured over 6h40m on 2026-09-04, a */15 schedule produced 2
    # runs where 27 were due. The watchdog cannot watch anything if it does not
    # run, so ask more often and accept that most requests are dropped. Each run
    # is a few curl calls, so a firing costs seconds.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Dispatch collectors even if the data looks fresh"
        type: boolean
        default: false

permissions:
  contents: read
  # So this job can dispatch the collectors itself when the Worker cannot be
  # reached. workflow_dispatch is one of the two events GITHUB_TOKEN is still
  # allowed to trigger, so no extra PAT is needed for the fallback.
  actions: write

concurrency:
  group: liveness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check data freshness, and recover if stale
        env:
          RUN_KEY: ${{ secrets.WORKER_RUN_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail

          # How old the data may be before this is worth acting on. Collectors
          # run every 2 minutes, so 10 absorbs four missed runs without crying
          # wolf. Healthy data is never more than about 3 minutes old by the
          # time this checks, so there is a wide margin before a false alarm.
          STALE_MINUTES=10

          status=$(curl -sS --max-time 20 https://198x.online/api/status || echo '{}')
          computed=$(printf '%s' "$status" | sed -n 's/.*"computedAt":"\([^"]*\)".*/\1/p')

          if [ -z "$computed" ]; then
            echo "could not read /status: $status"
            age_min=9999
          else
            now=$(date -u +%s)
            then=$(date -u -d "$computed" +%s)
            age_min=$(( (now - then) / 60 ))
            echo "data timestamp: $computed  (${age_min} minutes old)"
          fi

          if [ "$age_min" -lt "$STALE_MINUTES" ] && [ "${FORCE:-false}" != "true" ]; then
            echo "fresh enough; nothing to do"
            exit 0
          fi

          echo "stale (${age_min}m) - asking the Worker to dispatch the collectors"
          if [ -n "${RUN_KEY:-}" ]; then
            code=$(curl -sS -o /tmp/run.json -w '%{http_code}' --max-time 25 \
              -X POST "https://cron.198x.online/run" -H "x-run-key: ${RUN_KEY}" || echo 000)
            echo "worker /run -> HTTP ${code}: $(cat /tmp/run.json 2>/dev/null | head -c 200)"
          else
            echo "WORKER_RUN_KEY not set; cannot ask the Worker"
            code="skipped"
          fi

          # Recover without the Worker when the Worker is the thing that broke.
          #
          # Every recovery path used to run through https://cron.198x.online, so
          # a Cloudflare outage, a bad deploy or an expired Worker token left
          # this job able to notice the problem and do nothing about it. The
          # collectors accept workflow_dispatch directly, and GITHUB_TOKEN is
          # allowed to trigger that event, so dispatch them here instead.
          fallback=""
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "the Worker did not accept the request; dispatching the collectors directly"
            for wf in tracker.yml presence.yml; do
              wf_code=$(curl -sS -o /tmp/wf.json -w '%{http_code}' --max-time 25 \
                -X POST "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/dispatches" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -d "{\"ref\":\"${REF}\"}" || echo 000)
              echo "  ${wf} -> HTTP ${wf_code} $(head -c 160 /tmp/wf.json 2>/dev/null)"
              fallback="${fallback} ${wf}:${wf_code}"
            done
          fi

          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            text="**RL Pro Tracker: collection is behind.** Published data is ${age_min} minutes old. Asked the Worker to dispatch collectors (HTTP ${code}).${fallback:+ Worker unreachable, dispatched directly:${fallback}.} https://198x.online/"
            curl -sS --max-time 20 -H 'content-type: application/json' \
              -d "$(printf '{"content":%s}' "$(printf '%s' "$text" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
              "$DISCORD_WEBHOOK" >/dev/null && echo "notified Discord"
          else
            echo "DISCORD_WEBHOOK not set; no notification sent"
          fi

      - name: Warn before the dispatch token expires
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -uo pipefail
          # The PAT the Worker dispatches with has a fixed expiry. When it
          # lapses every collector stops at once, and nothing fails loudly:
          # dispatches just start returning 404 and the board quietly freezes.
          # GitHub reports the expiry on every authenticated response, so the
          # Worker surfaces it and this warns while there is still time.
          WARN_DAYS=30

          health=$(curl -sS --max-time 20 https://cron.198x.online/ || echo '{}')
          days=$(printf '%s' "$health" | sed -n 's/.*"tokenDaysLeft":\([0-9-]*\).*/\1/p')
          expires=$(printf '%s' "$health" | sed -n 's/.*"tokenExpires":"\([^"]*\)".*/\1/p')

          if [ -z "$days" ]; then
            echo "could not read token expiry from the Worker"
            exit 0
          fi
          echo "dispatch token expires ${expires} (${days} days left)"
          [ "$days" -gt "$WARN_DAYS" ] && exit 0

          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            text="**RL Pro Tracker: the dispatch token expires in ${days} days** (${expires}). When it lapses every collector stops. Issue a new fine-grained PAT with Actions and Issues write, then update RUN_KEY's sibling GH_TOKEN on both the Worker and the Pages project."
            curl -sS --max-time 20 -H 'content-type: application/json'               -d "$(printf '{"content":%s}' "$(printf '%s' "$text" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")"               "$DISCORD_WEBHOOK" >/dev/null && echo "warned on Discord"
          fi

      - name: Warn when the deployed build is behind main
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The other axis of staleness. Every other check here watches the
          # DATA - collector output on the `data` branch, read through
          # /api/status. This watches the CODE the site is actually serving.
          #
          # On 2026-09-10 main carried a day of shipped work that visitors never
          # saw: it was pushed, but only `wrangler pages deploy` moves the page
          # and nobody had run it. Data was fresh throughout, so every existing
          # alarm stayed green and the gap surfaced only because someone went
          # looking for a feature they knew they had shipped.
          #
          # This NEVER deploys and NEVER pushes. Deploys stay manual on purpose,
          # so a release can be checked before it is public; the only thing
          # missing was that a forgotten deploy said nothing. It adds no commit
          # to any branch.
          BEHIND_MINUTES=90   # grace, so a deploy in progress is not a warning

          stamp=$(curl -sS --max-time 20 "https://198x.online/build.json" || echo '{}')
          deployed=$(printf '%s' "$stamp" | sed -n 's/.*"commit": *"\([0-9a-f]*\)".*/\1/p')

          if [ -z "$deployed" ]; then
            # Predates the stamp, or the deploy did not include it. Nothing to
            # compare, so say so and stay quiet rather than guessing.
            echo "no build stamp on the live site; skipping"
            exit 0
          fi
          if [ "$deployed" = "$MAIN_SHA" ]; then
            echo "deployed build is main (${MAIN_SHA})"
            exit 0
          fi

          # How far behind, and since when. `compare` reports ahead_by from the
          # deployed commit to main, which is 0 when the deploy is AHEAD of main
          # (a deploy from an unpushed commit) - that is not staleness, so it is
          # not warned about.
          cmp=$(curl -sS --max-time 25 -H "authorization: Bearer ${GH_TOKEN}" \
                 -H "accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${REPO}/compare/${deployed}...${MAIN_SHA}" || echo '{}')
          ahead=$(printf '%s' "$cmp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ahead_by",0))' 2>/dev/null || echo 0)

          if [ "${ahead:-0}" -lt 1 ]; then
            echo "deployed ${deployed} is not behind main; nothing to say"
            exit 0
          fi

          # Age of the oldest undeployed commit, so a warning means "this has
          # been sitting" rather than "you pushed 40 seconds ago".
          age=$(printf '%s' "$cmp" | python3 -c '
import json,sys,datetime
d=json.load(sys.stdin)
cs=d.get("commits") or []
if not cs: print(0); raise SystemExit
t=cs[0]["commit"]["committer"]["date"]
dt=datetime.datetime.fromisoformat(t.replace("Z","+00:00"))
print(int((datetime.datetime.now(datetime.timezone.utc)-dt).total_seconds()//60))
' 2>/dev/null || echo 0)

          echo "deployed ${deployed} is ${ahead} commit(s) behind main; oldest undeployed is ${age} min old"
          [ "${age:-0}" -lt "$BEHIND_MINUTES" ] && { echo "within the ${BEHIND_MINUTES} min grace"; exit 0; }

          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            text="**RL Pro Tracker: the live site is ${ahead} commit(s) behind main.** The oldest undeployed commit is ${age} minutes old. Data is unaffected - this is the code visitors are running. Deploy with: npm run build:site && npx wrangler pages deploy web --project-name=rlprotracker --branch=main"
            curl -sS --max-time 20 -H 'content-type: application/json' \
              -d "$(printf '{"content":%s}' "$(printf '%s' "$text" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
              "$DISCORD_WEBHOOK" >/dev/null && echo "warned on Discord"
          else
            echo "DISCORD_WEBHOOK not set; no notification sent"
          fi
