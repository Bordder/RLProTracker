name: Liveness

# Watches the published data and does something about it when it goes stale.
#
# The failure this exists for produces no error anywhere: on 2026-09-02 the
# Cloudflare Worker's cron triggers stopped firing while the Worker itself stayed
# healthy - registered schedules, no incident, no invocations, and a redeploy
# changed nothing. Nothing failed, so nothing notified, and the board quietly
# served numbers 19 minutes old.
#
# GitHub's scheduler drops runs too, so this is deliberately not the primary
# trigger for anything. It is a watchdog: whenever it does run, it checks how old
# the published data is, dispatches the collectors itself if needed, and says so
# on Discord.
#
# It used to ask the Worker to do the dispatching, over a key-guarded /run
# endpoint, and fall back to dispatching directly when that failed. The Worker
# call was removed on 10 September 2026 after the key on the two sides drifted
# apart and /run answered 403 for an unknown length of time while the fallback
# quietly carried every recovery. Two paths where one rots unnoticed is worse
# than one path that always works: GITHUB_TOKEN is scoped for workflow_dispatch
# already, so the direct route needs no shared secret and nothing to keep in
# sync. The Worker keeps its cron triggers - it is still the primary dispatcher
# for the collectors - and this job still reads token expiry off its / route.

on:
  schedule:
    # GitHub drops most scheduled runs on public repos, and this one is no
    # exception: measured over 6h40m on 2026-09-04, a */15 schedule produced 2
    # runs where 27 were due. The watchdog cannot watch anything if it does not
    # run, so ask more often and accept that most requests are dropped. Each run
    # is a few curl calls, so a firing costs seconds.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Dispatch collectors even if the data looks fresh"
        type: boolean
        default: false

permissions:
  contents: read
  # So this job can dispatch the collectors itself when the Worker cannot be
  # reached. workflow_dispatch is one of the two events GITHUB_TOKEN is still
  # allowed to trigger, so no extra PAT is needed for the fallback.
  actions: write

concurrency:
  group: liveness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check data freshness, and recover if stale
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -uo pipefail

          # How old the data may be before this is worth acting on. Collectors
          # run every 2 minutes, so 10 absorbs four missed runs without crying
          # wolf. Healthy data is never more than about 3 minutes old by the
          # time this checks, so there is a wide margin before a false alarm.
          STALE_MINUTES=10

          status=$(curl -sS --max-time 20 https://198x.online/api/status || echo '{}')
          computed=$(printf '%s' "$status" | sed -n 's/.*"computedAt":"\([^"]*\)".*/\1/p')

          # Two separate faults that used to share one number. An unreadable
          # /api/status was reported as "9999 minutes old", which reads on
          # Discord as a frozen board when the real news is that this job could
          # not reach the site - a runner-side network failure, or Cloudflare
          # turning away an Actions IP, is indistinguishable from a genuine
          # freeze once it has been flattened into an age. So keep them apart:
          # age_min stays empty when there is no timestamp to measure, and the
          # message says which of the two it is.
          if [ -z "$computed" ]; then
            echo "could not read /api/status: $status"
            age_min=""
            situation="**RL Pro Tracker: cannot read the site.** \`/api/status\` returned no \`computedAt\`, so the age of the published data is unknown."
          else
            now=$(date -u +%s)
            then=$(date -u -d "$computed" +%s)
            age_min=$(( (now - then) / 60 ))
            echo "data timestamp: $computed  (${age_min} minutes old)"
            situation="**RL Pro Tracker: collection is behind.** Published data is ${age_min} minutes old."
          fi

          if [ -n "$age_min" ] && [ "$age_min" -lt "$STALE_MINUTES" ] && [ "${FORCE:-false}" != "true" ]; then
            echo "fresh enough; nothing to do"
            exit 0
          fi

          # Dispatch the collectors. One path, no shared secret.
          #
          # workflow_dispatch is one of the two events GITHUB_TOKEN is still
          # allowed to trigger, so this needs nothing beyond the actions: write
          # permission above.
          echo "acting - dispatching the collectors"
          dispatched=""
          failed=""
          for wf in tracker.yml presence.yml; do
            wf_code=$(curl -sS -o /tmp/wf.json -w '%{http_code}' --max-time 25 \
              -X POST "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/dispatches" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"ref\":\"${REF}\"}" || echo 000)
            echo "  ${wf} -> HTTP ${wf_code} $(head -c 160 /tmp/wf.json 2>/dev/null)"
            # 204 is what a successful dispatch returns. An earlier version put
            # "tracker.yml:204" into the Discord text, which reads as a file and
            # a line number and made a working recovery look like more fault.
            if [ "$wf_code" = "204" ]; then
              dispatched="${dispatched}${dispatched:+, }${wf}"
            else
              failed="${failed}${failed:+, }${wf} (HTTP ${wf_code})"
            fi
          done

          outcome=""
          [ -n "$dispatched" ] && outcome=" Dispatched: ${dispatched}."
          [ -n "$failed" ] && outcome="${outcome} **Dispatch failed: ${failed}.**"

          # Throttle the announcement, not the recovery.
          #
          # This job asks to run every 5 minutes and a stale board stays stale
          # until someone fixes it, so the unthrottled version posted the same
          # sentence up to twelve times an hour - and the unreadable-status path
          # did it indefinitely, because a site this job cannot reach never
          # looks fresh. An alarm at that rate gets the channel muted, which is
          # the reasoning alerts.yml already runs on.
          #
          # There is no state to compare against here (no checkout, contents:
          # read), so the throttle is the wall clock: announce only in the first
          # ten minutes of the hour. Collectors are still dispatched on every
          # firing, so recovery is unchanged; only the message is hourly. The
          # cost is that a fault starting and clearing inside one hour without
          # overlapping that window goes unannounced - acceptable, because the
          # dispatch that fixed it ran anyway.
          minute=$(date -u +%-M)
          if [ "$minute" -ge 10 ] && [ "${FORCE:-false}" != "true" ]; then
            echo "condition present, but outside the hourly notification window (minute ${minute}); collectors were dispatched regardless"
          elif [ -n "${DISCORD_WEBHOOK:-}" ]; then
            text="${situation}${outcome} https://198x.online/"
            curl -sS --max-time 20 -H 'content-type: application/json' \
              -d "$(printf '{"content":%s}' "$(printf '%s' "$text" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
              "$DISCORD_WEBHOOK" >/dev/null && echo "notified Discord"
          else
            echo "DISCORD_WEBHOOK not set; no notification sent"
          fi

      - name: Warn before the dispatch token expires
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -uo pipefail
          # The PAT the Worker dispatches with has a fixed expiry. When it
          # lapses every collector stops at once, and nothing fails loudly:
          # dispatches just start returning 404 and the board quietly freezes.
          # GitHub reports the expiry on every authenticated response, so the
          # Worker surfaces it and this warns while there is still time.
          WARN_DAYS=30

          health=$(curl -sS --max-time 20 https://cron.198x.online/ || echo '{}')
          days=$(printf '%s' "$health" | sed -n 's/.*"tokenDaysLeft":\([0-9-]*\).*/\1/p')
          expires=$(printf '%s' "$health" | sed -n 's/.*"tokenExpires":"\([^"]*\)".*/\1/p')

          if [ -z "$days" ]; then
            echo "could not read token expiry from the Worker"
            exit 0
          fi
          echo "dispatch token expires ${expires} (${days} days left)"
          [ "$days" -gt "$WARN_DAYS" ] && exit 0

          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            text="**RL Pro Tracker: the dispatch token expires in ${days} days** (${expires}). When it lapses every collector stops. Issue a new fine-grained PAT with Actions and Issues write, then update RUN_KEY's sibling GH_TOKEN on both the Worker and the Pages project."
            curl -sS --max-time 20 -H 'content-type: application/json'               -d "$(printf '{"content":%s}' "$(printf '%s' "$text" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")"               "$DISCORD_WEBHOOK" >/dev/null && echo "warned on Discord"
          fi
