name: Roster refresh (daily)

# Rebuilds player -> SteamID mapping from Liquipedia every 3 days.
# Rosters change rarely, so this cadence is plenty and stays far under
# Liquipedia's rate limits (a handful of batched requests per run).
# Edit data/teams.json when the RLCS field changes.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: roster-refresh
  cancel-in-progress: false

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Rebuild roster from Liquipedia
        run: npm run fetch:roster
      - name: Commit roster
        run: |
          git config user.name "rl-tracker-bot"
          git config user.email "actions@github.com"
          git add data/roster.json data/teams.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "[skip ci] data: roster refresh"
          # Clear any half-finished rebase before retrying: without this, one
          # conflict leaves unmerged files behind and every later attempt dies
          # on them instead of trying again.
          #
          # -X theirs means the commit being replayed - our freshly computed
          # data - wins a conflict. That is what we want: the file is
          # regenerated from scratch each run, so the newer copy is correct and
          # there is nothing in the older one worth merging.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --autostash -X theirs origin main && git push; then
              exit 0
            fi
            echo "push retry $i"; sleep $((RANDOM % 8 + 3))
          done
          git rebase --abort 2>/dev/null || true
          echo "push failed after retries"; exit 1
