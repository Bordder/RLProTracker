name: Presence poll

# Records which rostered players are in Rocket League right now. Steam reports
# the live game field for any profile that is not fully private, including ones
# whose game HISTORY is hidden - so this is the only route to activity data for
# players the playtime API refuses.
#
# Driven by an external cron hitting the workflow_dispatch API: GitHub's own
# scheduler drops high-frequency runs (a */5 cron produced zero runs in 26
# minutes), so the schedule below is a slow safety net rather than the primary
# trigger. Each poll credits in-game players a few minutes of playtime, so gaps
# undercount rather than corrupt.
#
# Costs nothing: one batched Steam call per run, unproxied, well inside quota.

on:
  schedule:
    - cron: "*/10 * * * *" # safety net; the Cloudflare Worker drives the real cadence
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: presence
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The data branch, checked out beside the code. Collector output lives
      # there so main's history stays code only; the collectors still need the
      # previous run's files as input, which is why it is fetched rather than
      # just pushed to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: data
          path: .databranch
          fetch-depth: 1

      # The raw log is NOT taken from here any more: see the cache steps below.
      - name: Take the previous run's data from the data branch
        run: |
          for p in data/derived/presence-hours.json data/derived/uptime-presence.json; do
            if [ -e ".databranch/$p" ]; then
              mkdir -p "$(dirname "$p")"
              # rm first: cp -r copies a directory INTO an existing directory of
              # the same name rather than over it, which nests it one level
              # deeper on every run. See the note in scripts/publish-data.sh.
              rm -rf "$p"
              cp -r ".databranch/$p" "$p"
            fi
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # The raw log, which names who was in game at every poll, lives in the
      # Actions cache rather than on the public data branch. Only the hours
      # worked out from it are published. It is sealed with PRESENCE_LOG_KEY
      # (scripts/presenceLogCache.mjs) because pull requests, including ones
      # from forks, can restore caches written on main, and they never get the
      # key. Each run saves under its own key and restores the newest, since a
      # cache entry cannot be overwritten; GitHub evicts the old ones.
      - name: Restore the sealed presence log
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .presence-cache
          key: presence-log-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: presence-log-

      # Never fails the run: a missing key, a cache miss or a copy that will not
      # decrypt starts a fresh log, and the output says which.
      - name: Open the presence log
        env:
          PRESENCE_LOG_KEY: ${{ secrets.PRESENCE_LOG_KEY }}
          # Read only when the cache has no copy: the one-time handover from
          # the data branch, which still holds the log until it is cleaned.
          PRESENCE_LOG_SEED: .databranch/data/presence/log.jsonl
        run: node scripts/presenceLogCache.mjs open

      - name: Poll live presence
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: npm run poll

      - name: Recompute presence hours
        run: npm run poll:hours

      - name: Seal the presence log
        env:
          PRESENCE_LOG_KEY: ${{ secrets.PRESENCE_LOG_KEY }}
        run: node scripts/presenceLogCache.mjs seal

      - name: Save the sealed presence log
        if: hashFiles('.presence-cache/log.sealed') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .presence-cache
          key: presence-log-${{ github.run_id }}-${{ github.run_attempt }}

      # The hours totals and the uptime record only. data/presence stays off
      # the branch.
      - name: Publish data to the data branch
        run: >-
          bash scripts/publish-data.sh "[skip ci] data: presence poll"
          data/derived/presence-hours.json
          data/derived/uptime-presence.json
