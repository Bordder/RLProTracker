name: Proxy health

# One request per proxy, and a Discord message naming the dead ones by index.
#
# The failure this exists for is silent by construction. On 2026-09-10 six of
# fifteen proxies were failing 100% of their requests and nothing reported it:
# a failed scrape is retried on another proxy and matchesPlayed is cumulative,
# so the board still filled in. The only symptoms were a third of players
# missing from each run and a 92s scrape, neither of which looks like a proxy
# problem. The provider's own dashboard showed all fifteen "Working", because it
# tests its tunnels rather than whether tracker.gg accepts them.
#
# Deliberately its own workflow rather than a step in tracker.yml: a probe of
# every proxy on every 2-minute run would cost more than the failures do, and a
# health check that makes the thing it watches slower is a bad trade.

on:
  schedule:
    # Hourly. Ten requests an hour against proxies the collector already drives
    # at ~230 an hour each is 0.4% more load, so frequency is not what strains
    # them. What does is BURSTS: six full probes 25 minutes apart on 2026-09-10
    # took the working count from 7 to 3 as the provider throttled. An hour
    # apart is a different shape entirely.
    #
    # GitHub drops most scheduled runs on public repos anyway - liveness.yml
    # measured a */15 schedule producing 2 runs where 27 were due - so asking
    # hourly buys a few real firings a day rather than 24.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1

      # Mirrors tracker.yml: fetch the browser, try to launch it, and only pay
      # for the apt install when that actually fails.
      - name: Install Chromium
        run: |
          npx playwright install chromium
          if node -e "require('playwright').chromium.launch().then(b=>b.close())" 2>/dev/null; then
            echo "browser launches as-is; skipping apt"
          else
            echo "launch failed; installing system dependencies"
            npx playwright install-deps chromium
          fi

      - name: Probe every proxy
        env:
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORTS: ${{ secrets.PROXY_PORTS }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Mask every endpoint BEFORE anything runs, so an address cannot reach
          # this log even by accident. GitHub masks a secret only as a whole
          # value, and one host:port is a substring of PROXY_LIST.
          node scripts/maskProxies.mjs
          # --json prints one line of integers and fixed verdict strings.
          node scripts/proxyProbe.mjs --json > probe.json 2> probe.err || true
          [ -s probe.json ] || { echo "probe produced no output"; tail -5 probe.err || true; exit 0; }
          node scripts/alertProxies.mjs probe.json
