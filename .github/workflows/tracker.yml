name: Tracker update

# Collects ranked MMR and games-played per playlist from tracker.gg using a
# headless browser (stealth) that clears Cloudflare, then commits the results.
# Offset 30 minutes from the Steam job so their pushes don't overlap.

on:
  schedule:
    - cron: "*/20 * * * *" # every 20 min; each run scrapes only the due players
  workflow_dispatch: {}

permissions:
  contents: write

# A new run cancels a still-running previous one. Runs normally finish in a few
# minutes and triggers are 20 min apart, so this only fires when a run has hung -
# self-healing instead of a stuck run blocking the queue.
concurrency:
  group: tracker-update
  cancel-in-progress: true

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # hard cap so a hung browser/proxy can't run for the 6h default
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect tracker data (MMR + games, then aggregate)
        env:
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORTS: ${{ secrets.PROXY_PORTS }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: npm run tracker

      - name: Prune old snapshots
        run: node scripts/pruneSnapshots.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "rl-tracker-bot"
          git config user.email "actions@github.com"
          git add data/tracker-snapshots data/derived data/tracker-state.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "data: hourly tracker update [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push retry $i"; sleep $((RANDOM % 8 + 3))
          done
          echo "push failed after retries"; exit 1
