name: Tracker update

# Collects ranked MMR and games-played per playlist from tracker.gg using a
# headless browser (stealth) that clears Cloudflare, then commits the results.
# Offset 30 minutes from the Steam job so their pushes don't overlap.

on:
  schedule:
    - cron: "*/5 * * * *"  # safety net; the Cloudflare Worker (worker/) drives the
                           # real cadence via workflow_dispatch. GitHub drops most
                           # high-frequency scheduled runs on public repos anyway, and a
                           # */5 here just adds collisions with the dispatcher.
  workflow_dispatch: {}

permissions:
  contents: write

# Overlapping dispatches QUEUE rather than kill the run in progress. The comment
# this replaces assumed triggers were 20 minutes apart; they are now 3, and two
# dispatchers were live at once, so cancel-in-progress was destroying runs
# mid-scrape - 3 of 6 consecutive runs cancelled at 00:20-00:24, each having
# already spent proxy bandwidth. A scrape that finishes late is still useful
# data; a cancelled one is pure waste. timeout-minutes below still caps a hang.
concurrency:
  group: tracker-update
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # hard cap so a hung browser/proxy can't run for the 6h default
    steps:
      - uses: actions/checkout@v7

      # The data branch, checked out beside the code. Collector output lives
      # there so main's history stays code only; the collectors still need the
      # previous run's files as input, which is why it is fetched rather than
      # just pushed to.
      - uses: actions/checkout@v7
        with:
          ref: data
          path: .databranch
          fetch-depth: 1

      - name: Take the previous run's data from the data branch
        run: |
          for p in data/tracker-history.json data/tracker-state.json data/derived/tracker.json data/derived/team-tracker.json data/derived/uptime.json data/proxy-use.json; do
            if [ -e ".databranch/$p" ]; then
              mkdir -p "$(dirname "$p")"
              cp -r ".databranch/$p" "$p"
            fi
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Without this the install re-resolves Playwright and the stealth
          # plugin from the registry on every run. Measured 2026-09-03: 271s of
          # install against a 29s scrape, which pushed runs past the 2-minute
          # dispatch interval and left GitHub cancelling the queued one.
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Chromium is 22s of a ~65s run, which is the single biggest fixed cost in
      # the cadence. The browser binaries are cached on the Playwright version, so
      # a warm run only pays for the OS deps.
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.62.1

      # install-deps is an apt install and costs ~15s of every run, but the
      # runner image may already carry Chromium's libraries. Rather than assume
      # either way, prove it: fetch the browser, try to launch it, and only pay
      # for apt when that actually fails. Self-correcting, so if a future image
      # drops a library the run repairs itself instead of breaking.
      - name: Install Chromium
        run: |
          npx playwright install chromium
          if node -e "require('playwright').chromium.launch().then(b=>b.close())" 2>/dev/null; then
            echo "browser launches as-is; skipping apt"
          else
            echo "launch failed; installing system dependencies"
            npx playwright install-deps chromium
          fi

      - name: Collect tracker data (MMR + games, then aggregate)
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }} # presenceHot: detect who's in-game
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORTS: ${{ secrets.PROXY_PORTS }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: npm run tracker

      - name: Prune old snapshots
        run: node scripts/pruneSnapshots.mjs

      - name: Publish data to the data branch
        run: >-
          bash scripts/publish-data.sh "[skip ci] data: tracker update"
          data/tracker-history.json
          data/tracker-state.json
          data/derived/tracker.json
          data/derived/team-tracker.json
          data/derived/uptime.json
          data/proxy-use.json
