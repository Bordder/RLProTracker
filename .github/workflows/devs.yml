name: Developer presence

# Which Psyonix developers have Rocket League open on Steam, for the Alpha
# Boost page. One Steam request for all of them, no proxy and no browser, so it
# runs every minute on its own rather than inside the tracker's run. Driven by
# the Cloudflare Worker (worker/), which dispatches it on its every-minute
# cron; the schedule below is only a slow safety net.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# A newer minute supersedes an older one, so an overlapping run is replaced.
concurrency:
  group: devs
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: data
          path: .databranch
          fetch-depth: 1

      # devs-state.json is the tracker's and is only read here, for the Steam
      # ids behind vanity links; it is never published from this job, so the
      # two jobs cannot overwrite each other's files.
      - name: Take the previous run's data from the data branch
        run: |
          for p in data/devs-state.json data/derived/devs-steam.json; do
            if [ -e ".databranch/$p" ]; then
              mkdir -p "$(dirname "$p")"
              rm -rf "$p"
              cp -r ".databranch/$p" "$p"
            fi
          done

      # No setup-node and no npm ci: the script uses only Node's own modules,
      # and the runner's Node is enough. Seconds matter at one run a minute.
      - name: Poll developer presence
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/devsSteam.mjs

      - name: Publish data to the data branch
        run: >-
          bash scripts/publish-data.sh "[skip ci] data: developer presence"
          data/derived/devs-steam.json
