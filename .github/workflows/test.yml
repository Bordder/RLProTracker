name: Tests

# Runs the zero-dependency unit suite (npm test) on every push/PR so a
# regression in the delta/scheduler cores is caught before it reaches the
# scheduled data workflows. No browser needed: the tests import the pure
# functions only (the scraper's main() is guarded behind direct invocation).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
