name: Bracket refresh

# Keeps data/derived/bracket.json current during a LAN.
#
# The collector decides for itself how hard to work: events.json lists every
# LAN, and collect.mjs only fetches a page whose event is inside its own
# window, backing off to almost nothing between tournaments. So this workflow
# can run on one cadence all year without hammering Liquipedia out of season -
# a --once run outside an event window fetches nothing at all.
#
# This schedule is the SAFETY NET, not the trigger. Measured 15 September:
# zero scheduled runs fired in the 2h20m after this workflow shipped, and
# liveness.yml, which asks for the same */5, managed four runs in fifteen
# hours. GitHub drops scheduled runs on a busy public repo and this one takes
# about 1,400 collector commits a day. The Cloudflare Worker dispatches this
# workflow instead - every 2 minutes on a day a LAN is being played - and the
# cron below only covers the Worker being down.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brackets
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Collector output lives on the data branch, so main's history stays
      # code only. publish-data.sh writes through this worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: data
          path: .databranch
          fetch-depth: 1

      - name: Take the previous run's wikitext cache
        run: |
          # The cache is what makes a failed fetch harmless: the collector
          # keeps serving the last good copy of a page rather than dropping
          # the event. Without restoring it, every run starts cold and a
          # Liquipedia hiccup empties a bracket.
          if [ -d ".databranch/data/bracket/cache" ]; then
            mkdir -p data/bracket
            cp -r .databranch/data/bracket/cache data/bracket/cache
          fi
          # The team alias maps, for the same reason. resolveTeams.mjs writes
          # them from an action=parse render, which is rate limited to one
          # request per 30 seconds, and without restoring them every run starts
          # from whatever was committed to main - so the resolve ran again every
          # two minutes during Worlds and its answer was thrown away each time.
          # Only teams-*.json: the rest of fixtures/ is frozen wikitext the
          # tests assert against, and nothing on the runner may overwrite that.
          for f in .databranch/data/bracket/fixtures/teams-*.json; do
            [ -e "$f" ] || continue
            mkdir -p data/bracket/fixtures
            cp "$f" data/bracket/fixtures/
          done

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Fetch and rebuild the bracket
        run: node scripts/collect.mjs --once

      - name: Publish
        run: >-
          bash scripts/publish-data.sh "[skip ci] data: bracket refresh"
          data/derived/bracket.json data/derived/event-now.json data/bracket/cache
          data/bracket/fixtures/teams-*.json
