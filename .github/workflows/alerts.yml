name: Alerts

# The two checks that need the repo checked out, kept out of liveness.yml.
#
# liveness.yml is deliberately pure curl: it runs every 5 minutes, dispatches
# collectors when data goes stale, and adding a checkout plus a Node install to
# it would slow the watchdog for no benefit. These two do not need 5-minute
# resolution.
#
#   the deployed build is behind main - the CODE visitors run, as opposed to the
#       data. Deploys are manual on purpose; this only removes the silence.
#   the collector's scrape success rate - whether collection is COMPLETE, as
#       opposed to whether it is ARRIVING. On 2026-09-10 the fleet sat at 72-80%
#       failure for most of a day and every freshness alarm stayed green,
#       because failed players retry next run and matchesPlayed is cumulative.
#   the live data check - what a visitor's browser actually receives, through
#       the Pages Function and the edge cache. It is the only check that reads
#       the site from outside, and the only one that reads the data for sense
#       rather than for age: mmr-history.json answered 502 for a day while the
#       repo was healthy, and a bracket named the winner of a series still
#       being played while every timestamp was current.
#
# Both read data that already exists and post to Discord. Neither deploys,
# pushes, or touches a proxy.

on:
  schedule:
    # Hourly. Neither alert is urgent to the minute - one is about a forgotten
    # deploy, the other about a degradation that unfolds over hours - and an
    # alarm that repeats every fifteen minutes for a condition lasting hours
    # teaches people to mute the channel, which costs the one time it matters.
    # GitHub drops most scheduled runs on public repos anyway.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Warn when the deployed build is behind main
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/alertBuildBehind.mjs

      - name: Warn when the collector's scrape success rate drops
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/alertScrapeRate.mjs

      # Last, and with if: always(), so a failure in either check above still
      # leaves the site itself checked. This is the one that goes red: the
      # others describe a degradation, this one says a visitor is being served
      # something wrong right now.
      - name: Check what the live site is serving
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/smokeLive.mjs
